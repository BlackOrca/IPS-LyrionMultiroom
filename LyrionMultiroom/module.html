<style>
/*
 * Farben kommen aus dem Symcon-Design (HTML-SDK): --accent-color, --content-color, --card-color,
 * neuere Versionen zusätzlich --on-accent-color und --error-color. Alle Flächen und Linien werden
 * daraus abgeleitet, damit die Kachel im hellen und dunklen Design passt. Schrift und Ränder
 * setzt Symcon auf den body; die Kachel überschreibt sie bewusst nicht.
 */
:root {
  --accent: var(--accent-color, #FFB547);
  --on-accent: var(--on-accent-color, #1A1206);
  --text: var(--content-color, #F3F4F6);
  --tile: var(--card-color, #171A21);
  --error: var(--error-color, #E5484D);
  --surface: color-mix(in srgb, var(--text) 5%, transparent);
  --surface2: color-mix(in srgb, var(--text) 9%, transparent);
  --line: color-mix(in srgb, var(--text) 11%, transparent);
  --line2: color-mix(in srgb, var(--text) 18%, transparent);
  --muted: color-mix(in srgb, var(--text) 72%, transparent);
  --dim: color-mix(in srgb, var(--text) 60%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  --accent-text: color-mix(in srgb, var(--accent) 58%, var(--text));
  --elev: color-mix(in srgb, var(--text) 5%, var(--tile));
  --warn-bg: color-mix(in srgb, var(--error) 12%, transparent);
  --warn-line: color-mix(in srgb, var(--error) 40%, transparent);
  --amb-src: var(--accent);
}
* { box-sizing: border-box; }
html { height: 100%; display: flex; flex-direction: column; }
body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
h1, h2, h3, p { margin: 0; }
.app { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; font-size: 14px; line-height: 1.35; }
.layout { flex: 1 1 auto; min-height: 0; display: flex; }
.pane { flex: 1 1 auto; min-width: 0; min-height: 0; display: none; flex-direction: column; position: relative; }
.app[data-layout=phone] .pane.on { display: flex; }
.app[data-layout=wide] .layout { gap: 14px; }
.app[data-layout=wide] .pane { display: flex; border-radius: 20px; overflow: hidden; background: var(--surface); }
.app[data-layout=wide] #paneRooms { flex: 0 0 min(380px, 32%); }
.app[data-layout=wide] #paneBrowse { flex: 0 0 min(360px, 30%); }
.app[data-layout=wide] .back { display: none; }
.app[data-layout=mini] .layout, .app[data-layout=mini] .tabbar { display: none; }
.mini { display: none; }
.app[data-layout=mini] .mini { display: flex; }
.h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.sec { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 12px; }

.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line2); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn.ghost { border: none; background: transparent; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line2); background: var(--surface); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.chip.hot { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-text); }
.btn { white-space: nowrap; height: 44px; padding: 0 16px; border-radius: 14px; border: none; background: var(--surface2); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; height: 52px; border-radius: 16px; font-size: 16px; }
.btn.block { width: 100%; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card.live { border-color: var(--accent-line); }
.zrow { display: flex; align-items: center; gap: 12px; }
.zhead { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 0; text-align: left; }
.cover { flex: none; border-radius: 12px; overflow: hidden; background: var(--surface2); position: relative; }
.cover img, .cover svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.c60 { width: 60px; height: 60px; }
.ztext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.zlabel { font-size: 12px; font-weight: 600; color: var(--accent-text); }
.ztitle { font-size: 16px; font-weight: 600; }
.zsub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.play { width: 48px; height: 48px; border-radius: 24px; border: none; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.bar { height: 3px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
.avatar { width: 18px; height: 18px; border-radius: 9px; color: #111418; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.avatar.l { width: 32px; height: 32px; border-radius: 16px; font-size: 13px; }
.badge { font-size: 10px; color: var(--accent-text); border: 1px solid var(--accent-line); border-radius: 6px; padding: 1px 5px; font-weight: 500; }

.vlist { display: flex; flex-direction: column; gap: 2px; }
.vrow { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.vname { width: 104px; flex: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.vval { width: 28px; text-align: right; font-size: 13px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; height: 28px; background: transparent; margin: 0; cursor: pointer; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p), var(--line2) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--tile); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line2); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--tile); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 8px; min-height: 64px; }
.tile .grow { display: flex; flex-direction: column; gap: 2px; }
.tile .name { font-size: 14px; font-weight: 600; }
.mini-btn { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line2); background: var(--surface2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mini-btn.hot { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-text); }
.hint { background: var(--surface); border: 1px dashed var(--line2); border-radius: 16px; padding: 14px; font-size: 13px; color: var(--muted); }
.banner { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); font-size: 13px; }

/* Zone / Now Playing: Hintergrund in der Farbe des Covers, auf die Kachelfarbe abgemischt */
#paneZone { background: color-mix(in srgb, var(--amb-src) 16%, var(--tile)); border-radius: 20px; transition: background .6s ease; }
.ztop { flex: none; height: 56px; padding: 0 6px; display: flex; align-items: center; gap: 4px; }
.ztop .center { flex: 1 1 auto; min-width: 0; text-align: center; }
.np { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.np .bigcover { width: 0; height: 0; border-radius: 20px; box-shadow: 0 14px 32px rgba(0,0,0,.25); }
.np .meta { width: 100%; max-width: 460px; display: flex; align-items: center; gap: 12px; }
.np .title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.np .artist { font-size: 15px; color: var(--muted); }
.np .progress { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 2px; }
.np .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: space-between; }
.ctl { width: 52px; height: 52px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; border-radius: 26px; color: var(--text); }
.ctl.small { width: 44px; height: 44px; color: var(--dim); }
.ctl.on { color: var(--accent); }
.ctl.big { width: 64px; height: 64px; border-radius: 32px; background: var(--accent); color: var(--on-accent); }
.panel { width: 100%; max-width: 460px; padding: 14px; border-radius: 18px; background: var(--surface2); display: flex; flex-direction: column; gap: 8px; }
.linkrow { width: 100%; max-width: 460px; display: flex; gap: 8px; flex-wrap: wrap; }
.linkrow .btn { flex: 1 1 140px; }
.pill { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line2); background: transparent; font-size: 13px; font-weight: 500; }
.empty { width: 100%; max-width: 460px; text-align: center; color: var(--muted); padding: 12px 0; }

/* Spotify */
.btop { flex: none; padding: 8px 0 8px; display: flex; align-items: center; gap: 4px; }
.app[data-layout=wide] .btop { padding: 10px 10px 8px; }
.btop .h { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.seg button { height: 42px; border-radius: 12px; border: none; background: transparent; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
.seg button[aria-pressed=true] { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.target { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.target select { flex: 1 1 auto; min-width: 0; height: 36px; border-radius: 10px; border: 1px solid var(--line2); background: var(--tile); color: var(--text); padding: 0 8px; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item .open { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 7px 0; text-align: left; }
.item .open[disabled] { cursor: default; color: var(--muted); }
.thumb { width: 44px; height: 44px; border-radius: 9px; overflow: hidden; background: var(--surface2); flex: none; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.search { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin: 6px 0; }
.search input { flex: 1 1 auto; min-width: 0; height: 40px; border: none; background: transparent; outline: none; }
.search input::placeholder { color: var(--dim); }
.skel { height: 58px; border-radius: 12px; background: linear-gradient(90deg, var(--surface), var(--surface2), var(--surface)); background-size: 200% 100%; animation: sk 1.2s linear infinite; margin-bottom: 6px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: 0 0; } }

/* Tab-Leiste */
.tabbar { flex: none; height: 60px; border-top: 1px solid var(--line); display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.app[data-layout=phone] .tabbar { display: grid; }
.tab { border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--dim); }
.tab[aria-current=page] { color: var(--accent-text); }

/* Sheets */
.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet-wrap[hidden] { display: none; }
.sheet { width: 100%; max-width: 520px; max-height: 88%; background: var(--elev); color: var(--text); border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
.app[data-layout=wide] .sheet-wrap { align-items: center; }
.app[data-layout=wide] .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); }
.sheet .shead { padding: 18px 18px 6px; display: flex; align-items: flex-start; gap: 8px; }
.sheet .sbody { overflow-y: auto; padding: 6px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
.sheet .sfoot { padding: 12px 18px 18px; border-top: 1px solid var(--line); }
.checkrow { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.checkrow:last-child { border-bottom: none; }
.checkrow input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.warn { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border: 1px solid var(--warn-line); font-size: 13px; }

/* Mini */
.mini { height: 100%; align-items: center; gap: 10px; }
.mini .cover { height: 100%; max-height: 96px; aspect-ratio: 1 / 1; width: auto; }

/* Seitenbasiertes Layout: nichts scrollt, Listen werden geblättert */
.view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 2px 0 6px; overflow: hidden; }
.app[data-layout=wide] .view { padding: 12px 14px 8px; }
.vhead { flex: none; min-height: 44px; gap: 8px; }
.vhead .chip { height: 36px; padding: 0 12px; }
.pagelist { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.pagelist > * { flex: none; }
.pager { flex: none; height: 48px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 13px; color: var(--muted); }
.pager .iconbtn { width: 40px; height: 40px; }
.pager .iconbtn[disabled] { opacity: .35; cursor: default; }
.sec { height: 20px; line-height: 20px; margin: 0; }
.sec.subhead { text-transform: none; letter-spacing: 0; font-size: 13px; }
.zcard { position: relative; height: 126px; padding: 12px 14px; gap: 8px; overflow: hidden; }
.zcard .zrow { height: 56px; }
.zcard .vrow { height: 36px; min-height: 0; }
.zbar { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 3px; }
.c56 { width: 56px; height: 56px; }
.idlerow { height: 64px; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; }
.tile { height: 64px; min-height: 0; }
.hint.h84 { height: 84px; display: flex; align-items: center; overflow: hidden; }
.vicon { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.iconbtn.sm { width: 36px; height: 36px; }
.vrow { height: 44px; min-height: 0; }
.searchrow { height: 58px; display: flex; align-items: center; }
.searchrow .search { flex: 1 1 auto; margin: 0; }
.skel { height: 58px; margin: 0; }
.covbox { flex: 1 1 auto !important; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.np > * { flex: none; }
.npvol { width: 100%; max-width: 460px; padding: 0 4px; border-radius: 16px; background: var(--surface2); }
.actions { width: 100%; max-width: 460px; display: flex; gap: 8px; }
.actions .btn { flex: 1 1 0; min-width: 0; height: 42px; padding: 0 10px; }
.stitle { font-size: 19px; font-weight: 700; }
.sheet.tall { height: min(88%, 680px); }
.sheet .sbody { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.checkrow { height: 54px; min-height: 0; padding: 0 4px; }
</style>

</div>

/* ------------------------------------------------------------------ Nachrichten vom Modul */

/* ------------------------------------------------------------------ Browse */
var SOURCE_NAMES = { spotify: 'Spotify', library: 'Bibliothek', favorites: 'Favoriten' };
var LIBRARY_ROOTS = [['search', 'Suche'], ['artists', 'Interpreten'], ['albums', 'Alben'], ['new', 'Neue Musik'], ['genres', 'Genres'], ['years', 'Jahre'], ['folder', 'Musikordner'], ['playlists', 'Wiedergabelisten']];
function sources() {
  var available = (S.st && S.st.sources) || [];
  return ['spotify', 'library', 'favorites'].filter(function (k) { return available.indexOf(k) >= 0; });
}
function currentSource() {
  var list = sources();
  if (S.browse.src && list.indexOf(S.browse.src) >= 0) return S.browse.src;
  var saved = null;
  try { saved = localStorage.getItem('lmr-source'); } catch (e) { /* kein Speicher verfügbar */ }
  return saved && list.indexOf(saved) >= 0 ? saved : (list[0] || null);
}
function rootKey() { var first = S.browse.stack[0]; return first && first.root ? first.root : ''; }
function browseLoad() {
  var t = targetZone(), src = currentSource();
  S.browse.src = src;
  S.browse.loaded = true;
  if (!t || !src) { render(); return; }
  var top = S.browse.stack[S.browse.stack.length - 1];
  S.browse.account = src === 'spotify' ? (t.account || '') : null;
  S.browse.error = false;
  if (src === 'library' && !top) {
    // Die Einstiege der Bibliothek kennt die Kachel selbst
    S.browse.req = 'library-root'; S.browse.loading = false; S.thumbs = {};
    S.browse.items = LIBRARY_ROOTS.map(function (r) { return { id: 'root:' + r[0], root: r[0], name: r[1], type: 'libroot', audio: false, items: true }; });
    render();
    return;
  }
  S.browse.req = Math.random().toString(36).slice(2);
  S.browse.loading = true;
  send({ c: 'browse', p: t.id, src: src, root: rootKey(), id: top ? top.id : '', q: top && top.q ? top.q : '', req: S.browse.req });
  render();
}
function browseReset() { S.browse.stack = []; S.browse.items = []; S.thumbs = {}; browseLoad(); }

/* ------------------------------------------------------------------ Ereignisse */
function optimisticToggle(id) {
  var z = zoneOf(id); if (!z) return;
  S.pending[z.id] = { mode: effMode(z) === 'play' ? 'pause' : 'play', until: Date.now() + 4000 };
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'FORM') return;
  var act = el.getAttribute('data-act'), p = el.getAttribute('data-p'), v = el.getAttribute('data-v');
  switch (act) {
    case 'tab': S.view = v; break;
    case 'openZone': S.zoneSel = p; if (S.layout !== 'wide') S.view = 'zone'; break;
    case 'toggle': optimisticToggle(p); send({ c: 'toggle', p: p }); break;
    case 'next': case 'prev': send({ c: act, p: p }); break;
    case 'shuffle': case 'repeat': send({ c: act, p: p, v: Number(v) }); break;
    case 'power': (zoneOf(p) ? zoneOf(p).members : [p]).forEach(function (id) { send({ c: 'power', p: id, v: Number(v) === 1 }); }); break;
    case 'mute': send({ c: 'mute', p: p, v: Number(v) === 1 }); var pl = player(p); if (pl) pl.muted = Number(v) === 1; break;
    case 'pauseAll': send({ c: 'pauseAll' }); zones().forEach(function (z) { if (effMode(z) === 'play') S.pending[z.id] = { mode: 'pause', until: Date.now() + 4000 }; }); break;
    case 'party':
      var pz = primaryZone();
      if (pz) send({ c: 'setZone', p: pz.id, v: [pz.id].concat(players().filter(function (x) { return x.connected && x.id !== pz.id; }).map(function (x) { return x.id; })) });
      break;
    case 'join':
      var jz = zoneOf(p), add = zoneOf(v);
      if (jz && add) send({ c: 'setZone', p: jz.id, v: jz.members.concat(add.members) });
      break;
    case 'editZone': var ez = zoneOf(p); S.sheet = { type: 'zone', zone: ez ? ez.id : p, sel: ez ? ez.members.slice() : [p], opened: Date.now() }; break;
    case 'volSheet': var vz = zoneOf(p); if (vz) S.sheet = { type: 'volumes', zone: vz.id, opened: Date.now() }; break;
    case 'page': turnPage(el.getAttribute('data-k'), Number(v)); return;
    case 'zonePreset':
      if (S.sheet) S.sheet.sel = v === 'all' ? [S.sheet.zone].concat(players().map(function (x) { return x.id; }).filter(function (id) { return id !== S.sheet.zone; })) : [S.sheet.zone];
      break;
    case 'applyZone':
      if (S.sheet) { send({ c: 'setZone', p: S.sheet.zone, v: S.sheet.sel.length ? S.sheet.sel : [] }); S.sheet = null; }
      break;
    case 'closeSheet': S.sheet = null; break;
    case 'accountSheet': S.sheet = { type: 'account', zone: p }; break;
    case 'account':
      send({ c: 'account', p: p, v: v });
      var az = zoneOf(p); if (az) { az.account = v; az.accountName = accName(v); }
      if (el.getAttribute('data-close')) S.sheet = null;
      if (S.browse.src === 'spotify') setTimeout(browseReset, 450);
      break;
    case 'source':
      S.browse.src = v;
      try { localStorage.setItem('lmr-source', v); } catch (e) { /* kein Speicher verfügbar */ }
      browseReset();
      return;
    case 'browseFor': S.target = p; if (S.layout !== 'wide') S.view = 'browse'; browseReset(); return;
    case 'browseBack': S.browse.stack.pop(); browseLoad(); return;
    case 'browseReload': browseLoad(); return;
    case 'item':
      var it = S.browse.items[Number(el.getAttribute('data-i'))]; if (!it) break;
      if (it.type === 'libroot') { S.browse.stack.push({ id: '', root: it.root, name: it.name }); browseLoad(); return; }
      if (it.items) { S.browse.stack.push({ id: it.id, name: it.name }); browseLoad(); return; }
      if (it.audio) S.sheet = { type: 'item', item: it };
      break;
    case 'playItem':
      var pi = S.browse.items[Number(el.getAttribute('data-i'))], ptz = targetZone();
      if (pi && ptz) { send({ c: 'playItem', p: ptz.id, src: S.browse.src, root: rootKey(), id: pi.id, v: 'play' }); S.pending[ptz.id] = { mode: 'play', until: Date.now() + 4000 }; }
      break;
    case 'itemMode':
      var mz = targetZone();
      if (S.sheet && S.sheet.item && mz) { send({ c: 'playItem', p: mz.id, src: S.browse.src, root: rootKey(), id: S.sheet.item.id, v: v }); if (v === 'play') S.pending[mz.id] = { mode: 'play', until: Date.now() + 4000 }; }
      S.sheet = null;
      break;
    default: return;
  }
  render();
});
$('#sheetWrap').addEventListener('click', function (e) { if (e.target === this) { S.sheet = null; render(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });

document.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-act=search]'); if (!f) return;
  e.preventDefault();
  var it = S.browse.items[Number(f.getAttribute('data-i'))], q = (f.q.value || '').trim();
  if (!it || !q) return;
  S.browse.stack.push({ id: it.id, name: '„' + q + '“', q: q });
  browseLoad();
});

document.addEventListener('change', function (e) {
  var el = e.target, act = el.getAttribute && el.getAttribute('data-act'), p = el.getAttribute && el.getAttribute('data-p');
  if (act === 'zoneSel' && S.sheet) {
    var sel = S.sheet.sel.filter(function (id) { return id !== p; });
    if (el.checked) sel.push(p);
    S.sheet.sel = sel; render(); return;
  }
  if (act === 'target') { S.target = el.value; browseReset(); return; }
  if (act === 'vol' || act === 'zoneVol' || act === 'seek') { finishDrag(el); }
});
document.addEventListener('input', function (e) {
  var el = e.target, act = el.getAttribute && el.getAttribute('data-act'), p = el.getAttribute('data-p');
  if (act !== 'vol' && act !== 'zoneVol' && act !== 'seek') return;
  S.drag = act + ':' + p;
  var val = Number(el.value);
  el.style.setProperty('--p', (100 * (val - Number(el.min || 0)) / ((Number(el.max) || 100) - Number(el.min || 0))).toFixed(1) + '%');
  if (act === 'vol') {
    var pl = player(p); if (pl) pl.volume = val;
    var lab = document.querySelector('[data-vval="' + p + '"]'); if (lab) lab.textContent = val;
    sendThrottled('vol:' + p, { c: 'vol', p: p, v: val }, 250);
  } else if (act === 'zoneVol') {
    var zl = document.querySelector('[data-vval="zone:' + p + '"]'); if (zl) zl.textContent = val;
    sendThrottled('zv:' + p, { c: 'zoneVol', p: p, v: val }, 350);
  } else {
    var tl = document.querySelector('[data-time="' + p + '"]'); if (tl) tl.textContent = fmt(val);
  }
});
function finishDrag(el) {
  var act = el.getAttribute('data-act'), p = el.getAttribute('data-p'), val = Number(el.value);
  if (act === 'seek') {
    send({ c: 'seek', p: p, v: val });
    var z = zoneOf(p); if (z) { z.time = val; S.recvAt = Date.now(); }
  } else if (act === 'vol') {
    send({ c: 'vol', p: p, v: val });
  } else {

['pointerup', 'touchend', 'pointercancel'].forEach(function (ev) {
  document.addEventListener(ev, function () { if (S.drag) setTimeout(function () { if (S.drag) { S.drag = null; if (S.dirty) { S.dirty = false; render(); } } }, 600); }, true);
});

/* Mausrad und Wischgesten blättern zusätzlich, sofern Symcon sie an die Kachel weitergibt */
var wheelLock = 0, touch = null;
document.addEventListener('wheel', function (e) {
  var el = e.target.closest && e.target.closest('[data-pager]');

  if (Date.now() < wheelLock) return;

}, { passive: true });

  if (!touch) return;
  var t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.5) turnPage(touch.k, dy < 0 ? 1 : -1);
  else if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turnPage(touch.k, dx < 0 ? 1 : -1);
  touch = null;
}, { passive: true });

/* ------------------------------------------------------------------ Fortschritt & Layout */
setInterval(function () {
  if (!S.st || S.drag) return;
  zones().forEach(function (z) {
    if (!z.duration || effMode(z) !== 'play') return;
    var pos = position(z), pct = (100 * pos / z.duration).toFixed(1) + '%';
    document.querySelectorAll('[data-prog="' + z.id + '"]').forEach(function (b) { b.style.width = pct; });
    document.querySelectorAll('[data-time="' + z.id + '"]').forEach(function (t) { t.textContent = fmt(pos); });
    document.querySelectorAll('[data-seek="' + z.id + '"]').forEach(function (r) { r.value = Math.floor(pos); r.style.setProperty('--p', pct); });
  });
}, 1000);

function computeLayout() {
  var w = window.innerWidth, h = window.innerHeight;
  if (w < 300 || h < 240) return 'mini';
  return (w >= 900 && h >= 480) ? 'wide' : 'phone';
}
/* An das Symcon-Design anpassen: Farbschema für native Bedienelemente (Regler, Auswahl, Häkchen)
   und – bei älteren Symcon-Versionen ohne --on-accent-color – die Schrift auf dem Akzent. */
(function adaptToDesign() {
  try {
    var lum = function (cssColor) {
      var probe = document.createElement('span');
      probe.style.color = cssColor;
      document.body.appendChild(probe);
      var m = getComputedStyle(probe).color.match(/[\d.]+/g);
      probe.remove();
      if (!m || m.length < 3) return null;
      var lin = function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      return 0.2126 * lin(+m[0]) + 0.7152 * lin(+m[1]) + 0.0722 * lin(+m[2]);
    };
    var root = document.documentElement;
    var text = lum('var(--text)');
    if (text !== null) root.style.colorScheme = text > 0.5 ? 'dark' : 'light';
    if (!getComputedStyle(root).getPropertyValue('--on-accent-color').trim()) {
      var acc = lum('var(--accent)');
      if (acc !== null) root.style.setProperty('--on-accent', acc > 0.179 ? '#111418' : '#FFFFFF');
    }
  } catch (e) { /* Standardwerte aus dem CSS bleiben */ }
})();

S.layout = computeLayout();
window.addEventListener('resize', function () { S.layout = computeLayout(); render(); });
render();
setTimeout(function () { send({ c: 'hello' }); }, 30);
</script>
